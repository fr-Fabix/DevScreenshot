name: DevScreenshot
options:
  bundleIdPrefix: de.rippcon
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: DevScreenshot
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: XF9U3N7W44
    ENABLE_HARDENED_RUNTIME: YES
    # Local/dev builds sign ad-hoc so no certificate is required.
    # Scripts/release.sh overrides this with "Developer ID Application".
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"

targets:
  DevScreenshot:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.rippcon.devscreenshot
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/DevScreenshot.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
